name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go@v5 caches go modules by default using go.sum as cache key

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...
