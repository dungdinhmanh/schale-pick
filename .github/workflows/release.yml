name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          OUTPUT="schale-pick-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -v \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${OUTPUT}" .
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schale-pick-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            schale-pick-${{ matrix.goos }}-${{ matrix.goarch }}
            schale-pick-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  package-arch:
    name: Build Arch package (x86_64)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      # archlinux:latest ships pacman + glibc but not nodejs/git, both of which
      # the GitHub-provided actions need to run. Install them first.
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs sudo

      - name: Create unprivileged builder user
        run: |
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: schale-pick-linux-amd64
          path: ./binary/

      - name: Stage build directory
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          BUILD=/home/builder/build
          mkdir -p "$BUILD"

          # Canonical PKGBUILD downloads the binary from the GitHub release
          # URL, which doesn't exist yet at this point. Copy it and rewrite
          # the source arrays to consume the artifact we just built locally.
          # The license shipped in /usr/share/licenses/<pkg>/LICENSE must be
          # the upstream project's license (MIT), so use the repo-root LICENSE.
          cp packaging/aur/schale-pick-bin/PKGBUILD "$BUILD/"
          cp LICENSE                                "$BUILD/"
          cp ./binary/schale-pick-linux-amd64       "$BUILD/"

          # Strip leading 'v' from the tag (PKGBUILD pkgver is unprefixed).
          PKGVER="${VERSION#v}"

          cd "$BUILD"
          sed -i \
            -e "s|^pkgver=.*|pkgver=${PKGVER}|" \
            -e 's|^source=.*|source=("LICENSE")|' \
            -e 's|^source_x86_64=.*|source_x86_64=("schale-pick-linux-amd64")|' \
            -e '/^source_aarch64=/d' \
            -e '/^sha256sums_aarch64=/d' \
            -e 's|"${srcdir}/${_pkgname}-${pkgver}-${CARCH}"|"${srcdir}/schale-pick-linux-amd64"|' \
            -e 's|"${srcdir}/LICENSE-${pkgver}"|"${srcdir}/LICENSE"|' \
            PKGBUILD

          chown -R builder:builder "$BUILD"

      - name: Build .pkg.tar.zst
        run: |
          set -eu
          su builder -c '
            set -eu
            cd /home/builder/build
            makepkg -f --noconfirm --nodeps --skipinteg
          '
          cp /home/builder/build/*.pkg.tar.zst .
          # Version-stable alias so users can curl
          # /releases/latest/download/schale-pick-bin-x86_64.pkg.tar.zst
          # without first looking up the exact pkgver-pkgrel.
          versioned=$(ls schale-pick-bin-*-x86_64.pkg.tar.zst | head -n1)
          cp "$versioned" schale-pick-bin-x86_64.pkg.tar.zst
          sha256sum schale-pick-bin-x86_64.pkg.tar.zst \
            > schale-pick-bin-x86_64.pkg.tar.zst.sha256

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: schale-pick-arch-x86_64-pkg
          path: |
            ./schale-pick-bin-*.pkg.tar.zst
            ./schale-pick-bin-x86_64.pkg.tar.zst.sha256

  release:
    name: Create Release
    needs: [build, package-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  deploy-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git openssh pacman-contrib nodejs sudo

      - name: Create builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -dm700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i /root/.ssh/aur -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Bump pkgver + updpkgsums + regen .SRCINFO
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          PKGVER="${VERSION#v}"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" packaging/aur/schale-pick-bin/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"         packaging/aur/schale-pick-bin/PKGBUILD
          chown -R builder:builder packaging/aur/schale-pick-bin
          su builder -c "
            cd $GITHUB_WORKSPACE/packaging/aur/schale-pick-bin
            updpkgsums
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Push to AUR
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global user.name  "dungdinhmanh"
          git config --global user.email "dungdinhmanh0209@gmail.com"
          git -c init.defaultBranch=master clone \
            ssh://aur@aur.archlinux.org/schale-pick-bin.git /tmp/aur-repo
          cp $GITHUB_WORKSPACE/packaging/aur/schale-pick-bin/PKGBUILD \
             $GITHUB_WORKSPACE/packaging/aur/schale-pick-bin/.SRCINFO \
             $GITHUB_WORKSPACE/packaging/aur/schale-pick-bin/LICENSE \
             /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping push."
            exit 0
          fi
          git commit -m "upgpkg: schale-pick-bin ${VERSION}"
          git push
