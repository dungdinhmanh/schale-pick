name: Feature Request
description: Suggest a new feature or improvement.
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea clearly.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case behind your request.
      placeholder: "It's tedious to manually edit config.jsonc after every student-picker run because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
      placeholder: "Add a --dry-run flag that prints the jq command without applying it."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this affect?
      options:
        - UI / layout
        - Image rendering (Kitty/termimg)
        - fastfetch config patching
        - Cache management
        - Settings screen
        - CLI flags
        - Build / packaging / release
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, links, or anything else helpful.
