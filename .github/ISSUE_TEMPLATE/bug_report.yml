name: Bug Report
description: Something is broken or behaving unexpectedly.
title: "fix: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I press ? the image is not cleared from the terminal..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "The image should be cleared when the help modal opens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch `student-picker`
        2. Navigate to a student with a portrait loaded
        3. Press `?`
        4. Image remains visible behind the modal
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: student-picker version
      placeholder: "v0.1.0  (run: student-picker --version)"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      placeholder: "Kitty 0.36.4 / WezTerm / Ghostty / ..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / distro
      placeholder: "Arch Linux (CachyOS), kernel 6.9.x"
    validations:
      required: true

  - type: textarea
    id: debug_log
    attributes:
      label: Debug log (optional)
      description: |
        Run with `student-picker --debug`, reproduce the issue, then paste the contents of
        `/tmp/student-picker-debug.log` here.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, config snippets, anything else that might help.
